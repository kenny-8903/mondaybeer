[project]
name = "py-workflow-system"
version = "0.1.0"
description = "Vibe coding lesson starter project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# Lint 契約顯式化：ruff 0.16 起預設啟用 413 條規則（原 59），
# 浮動版本會讓 CI 在「沒改程式碼」的狀況下變紅。這裡把要檢查的
# 規則集釘死，工具升級只會影響已選規則的修正，不會改變範圍。
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
